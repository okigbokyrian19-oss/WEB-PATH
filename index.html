<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        padding: 100px;
        background-color: #17536b;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;      
    }
    h1 {
        color: #1a73e8;
    }
    nav {
        position:fixed;
        top: 20px;     
        background: white;
        padding: 12px 30px;
        border-radius: 50px;
        box-shadow: 0 4px 15pxrgba(0,0,0,0.1);
    }
    nav a {
        color: #333;
        text-decoration: none;
        margin: 0 15px;
        font-family: Arial sans-serif;
        font-weight: bold;
    }
    nav a:hover {
        color: #1a73e8;
    }
.project-grid {
    display: flex;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 40px;
}
.card {
    background-color: white;
    padding: 20px;
    border-radius: 15px;
    width: 180px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    text-align: center;
    transition: transform 0.3s ease;
}
.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    cursor: pointer;
}
.card h3 {
    color: #1a73e8;
    margin-bottom: 5px;
    font-family: sans-serif;
}
.card p {
    color: #555;
    line-height: 1.6;
    font-family: "Segoe UI", Tahoma, Geneva, sans-serif;
    max-width: 600px;
}
.profile-area {
    margin-bottom: 20px;
}
.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    object-fit: cover;
}
.btn {
    display: inline-block;
    padding: 8px 15px;
    background-color: #1a73e8;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    margin-top: 15px;
    font-size: 14px;
    font-family: sans-serif;
}    
.btn:hover {
    background-color: #1557b0;
}
@media (max-width: 600px) {
.project-grid {
    flex-direction: column;
    align-items: center;
}
.card {
    width: 90%;
    max-width: 300px;
}
nav {
    width: 90%;
    padding: 10px 0px;
    display: flex;
    justify-content: space-around;
}
h1 {
    font-size: 1.5rem;
    padding: 0 20px;
}
}   
</style>
</head>
<body>   
    <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">projects</a>
        </nav>
   <div class="profile-area">
        <img src="me.jpg.JPG" alt="kyrin okigbo" class="profile-img">
   </div>
        <h1>My Professional Path Starts Here</h1>
   <p>I am currently setting up my development environment.</p>
   <div class="project-grid">
    <div class="card">
      <h3>Project 1</h3>
    <p>HTML Basics</p>
    <a href="#" class="btn">View Details</a>
    </div>
    <div class="card">
        <h3>Project 2</h3>
        <p>CSS Styling</p>
        <a href="#" class="btn">View Details</a>
    </div>
    <div class="card">
        <h3>Project 3</h3>
        <p>Development</p>
        <a href="#" class="btn">View Details</a>
    </div>
   </div>
</body>
</html>
